name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.checksums.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        # --legacy-peer-deps: the CI-bundled npm is stricter than the declared
        # packageManager (npm@11.11.1) and rejects vite-plus's stale typescript
        # peer range (^5||^6) against typescript 7. Install is driven by the
        # lockfile, so the result matches local `npm ci` on npm 11.
        run: cd ui && npm ci --legacy-peer-deps

      - name: Build MCP sidecar
        run: |
          cargo build -p markupsidedown-mcp --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/markupsidedown-mcp \
             src-tauri/binaries/markupsidedown-mcp-aarch64-apple-darwin
          ./src-tauri/binaries/markupsidedown-mcp-aarch64-apple-darwin --version

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --format="- %s" "${PREV_TAG}..HEAD" | grep -v "^- Bump version" || true)
          else
            CHANGES=$(git log --format="- %s" | grep -v "^- Bump version" || true)
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="- Maintenance release"
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: echo "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # Tauri signs the app and the MCP sidecar with the hardened runtime,
      # notarizes and staples the app, then builds and signs the DMG.
      - name: Build Tauri app (Apple Silicon)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MarkUpsideDown ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      # Tauri does not notarize the DMG, and Gatekeeper rejects a signed but
      # unnotarized DMG when it is opened from a browser download.
      - name: Notarize and staple DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="target/aarch64-apple-darwin/release/bundle/dmg/MarkUpsideDown_${VERSION}_aarch64.dmg"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Extract checksums
        id: checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="target/aarch64-apple-darwin/release/bundle/dmg/MarkUpsideDown_${VERSION}_aarch64.dmg"
          echo "dmg_sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew Tap
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: M-Igashi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DMG_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
        run: |
          cd Casks
          sed -i "s|version \"[^\"]*\"|version \"${VERSION}\"|" markupsidedown.rb
          sed -i "s|sha256 \"[^\"]*\"|sha256 \"${DMG_SHA256}\"|" markupsidedown.rb

      - name: Commit and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/markupsidedown.rb
          git commit -m "Update markupsidedown to ${VERSION}" || exit 0
          git push
