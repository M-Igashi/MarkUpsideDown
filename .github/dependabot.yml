version: 2
updates:
  # Rust (Cargo) — workspace root, so Cargo.lock is updated with the manifests
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # npm — ui/
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # npm — worker/
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci):"
    groups:
      # init and analyze must stay on the same version or CodeQL fails
      codeql-action:
        patterns:
          - "github/codeql-action*"
