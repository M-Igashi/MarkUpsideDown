<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkUpsideDown</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-open" title="Open file" class="icon-btn" data-icon="folder-open"></button>
      <button id="btn-save" title="Save file" class="icon-btn" data-icon="save"></button>
      <button id="btn-import" title="Import document as Markdown" class="icon-btn" data-icon="file-down"></button>
      <span class="separator"></span>
      <div id="url-bar">
        <input type="url" id="url-input" placeholder="Enter URL to fetch as Markdown…" />
        <button id="btn-get" title="Get URL as Markdown (auto-detects JS pages)">Get</button>
        <button id="btn-crawl" title="Crawl website and save as Markdown files">Crawl</button>
      </div>
      <span class="separator"></span>
      <button id="btn-table" title="Insert or edit Markdown table">Table</button>
      <button id="btn-cleanup" title="Clean up Markdown structure (normalize headings, links, tables)">Clean up</button>
      <span class="spacer"></span>
      <button id="btn-settings" title="Settings" class="icon-btn" data-icon="settings"></button>
    </div>
    <div id="app">
      <div id="sidebar"></div>
      <div id="sidebar-divider"></div>
      <div id="editor-container">
        <div id="editor-header">
          <div id="tab-bar"></div>
        </div>
        <div id="editor-pane"></div>
      </div>
      <div id="divider"></div>
      <div id="preview-wrapper">
        <div id="preview-pane"></div>
      </div>
    </div>
    <div id="status-bar"><span id="status"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
